[project]
name = "scope"
version = "1.15.1"
description = "Python AWS inventory runtime and installer for SCOPE"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "botocore>=1.34",
  "pydantic>=2.7",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scope*", "tools*"]
exclude = ["agents*", "config*", "dashboard*", "docs*", "scripts*", "test*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
